<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#e6edf5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#101114" media="(prefers-color-scheme: dark)">
  <title>GDG Calculator</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48' fill='none' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M17 12 5 24l12 12' stroke='%232b9df4'/%3E%3Cpath d='M31 12l12 12-12 12' stroke='%237cc4ff'/%3E%3Cpath d='M21 19h6M21 29h6' stroke='%232b9df4'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="calc">
    <header class="top">
      <h1 class="brand">
        <svg class="logo" viewBox="0 0 48 48" aria-hidden="true"><path d="M17 12 5 24l12 12"/><path d="M31 12l12 12-12 12"/><path d="M21 19h6M21 29h6"/></svg>
        <span>GDG Calculator</span>
      </h1>
      <button id="theme" class="switch" type="button" role="switch" aria-checked="true" aria-label="Dark mode"><span class="knob"></span></button>
    </header>

    <section class="screen" aria-live="polite">
      <div id="sub"></div>
      <div id="main">0</div>
    </section>

    <div class="pad">
      <button data-a="ac">AC</button>
      <button data-a="del" aria-label="Backspace">⌫</button>
      <button data-i="÷">÷</button>
      <button data-i="×">×</button>
      <button data-i="−">−</button>
      <button data-i="+">+</button>
      <button data-i="7">7</button>
      <button data-i="8">8</button>
      <button data-i="9">9</button>
      <button data-i="4">4</button>
      <button data-i="5">5</button>
      <button data-i="6">6</button>
      <button data-i="1">1</button>
      <button data-i="2">2</button>
      <button data-i="3">3</button>
      <button data-i="0">0</button>
      <button data-i=".">.</button>
      <button data-a="eq">=</button>

      <div class="fn">
        <button data-i="e">e</button>
        <button data-i="π">π</button>
        <button data-i="sin(">sin</button>
        <button data-a="deg" id="deg" aria-label="Toggle degrees and radians">deg</button>
        <button data-a="neg" aria-label="Change sign">±</button>
        <button data-i="cos(">cos</button>
        <button data-i="tan(">tan</button>
        <button data-i="ln(">ln</button>
        <button data-i="log(">log</button>
        <button data-i="(">(</button>
        <button data-i="√(">√</button>
        <button data-i="^2">x²</button>
        <button data-i="^">xʸ</button>
        <button data-i="!">n!</button>
        <button data-i=")">)</button>
        <button data-i="%">%</button>
      </div>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
